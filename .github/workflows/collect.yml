name: МедПраво — сбор и публикация
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: medpravo-collection
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Проверка программы
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_github_client.js
      - name: Восстановить историю
        run: python github_state.py restore
      - name: Проверить источники и подготовить ленту
        env:
          FETCH_TIMEOUT: '12'
        run: python github_collect.py
      - name: Сохранить историю для следующего запуска
        run: python github_state.py save
      - name: Подготовить сайт к публикации
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать ленту
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
